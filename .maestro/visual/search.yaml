# Search screen (Light/Dark). Ảnh: .maestro/visual/out/search/*.png
# Chạy: .maestro/visual/run.sh search
appId: ${APP_ID}
tags: [visual]
---
- runFlow: subflows/login_showcase.yaml
- runFlow:
    file: subflows/search_shots.yaml
    env:
      THEME: light
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/search_shots.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: light
