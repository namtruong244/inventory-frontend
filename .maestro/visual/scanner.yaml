# Scanner tab + unknown code (Light/Dark). Ảnh: .maestro/visual/out/scanner/*.png
# Chạy: .maestro/visual/run.sh scanner
appId: ${APP_ID}
tags: [visual]
---
- runFlow: subflows/login_showcase.yaml
- runFlow:
    file: subflows/scanner_shots.yaml
    env:
      THEME: light
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/scanner_shots.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: light
