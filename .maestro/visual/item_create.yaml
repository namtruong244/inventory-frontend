# Create/Edit item + sheets + discard dialog (Light/Dark). Ảnh: .maestro/visual/out/item_create/*.png
# Chạy: .maestro/visual/run.sh .maestro/visual/item_create.yaml
appId: ${APP_ID}
tags: [visual]
---
- runFlow: subflows/login_showcase.yaml
- runFlow:
    file: subflows/item_create_shots.yaml
    env:
      THEME: light
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/item_create_shots.yaml
    env:
      THEME: dark
- runFlow:
    file: subflows/set_theme.yaml
    env:
      THEME: light
