appId: ${APP_ID}
---
# Lần chạm đầu ngay sau login có thể bị bỏ qua khi Home còn đang tải; chạm lại vô hại.
# Toast "Welcome, X!"/"Welcome back, X!" che thanh nav và nuốt tap → chờ nó biến mất.
- extendedWaitUntil:
    notVisible: "Welcome.*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: nav_setting
- waitForAnimationToEnd
- tapOn:
    id: nav_setting
- scrollUntilVisible:
    element:
      id: settings_logout
# Nút có thể mới lú lên dưới thanh nav nổi → cuộn thêm cho nó ra khỏi nav.
- scroll
- tapOn:
    id: settings_logout
- tapOn:
    id: settings_logout_confirm
- extendedWaitUntil:
    visible:
      id: login_email
    timeout: 10000
